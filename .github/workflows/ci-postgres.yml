name: CI (SQLite-first)

on:
  push:
    branches: [ main, master, 'feat/*' ]
  pull_request:
    branches: [ main, master, 'feat/*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Prepare test files and SQLite DB
        run: |
          mkdir -p data
          touch dev.db
          echo "Using SQLite dev DB at ./dev.db for test run"
          # Apply the Prisma schema to the local sqlite dev.db (safe for CI)
          npx prisma db push --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.prisma
        shell: bash

      - name: Run tests
        run: npm test --silent
        env:
          DATABASE_URL: file:./dev.db
          

      - name: Upload test reports (optional)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-logs
          path: .

  postgres-integration:
    name: Postgres Integration
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done
        shell: bash

      - name: Apply Postgres migrations and generate client
        run: |
          npx prisma migrate deploy --schema=prisma/schema.postgres.prisma
          npx prisma generate --schema=prisma/schema.postgres.prisma
        shell: bash

      - name: Seed Postgres
        run: node prisma/seed.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Run integration tests (Postgres)
        run: npm test --silent -- --testNamePattern="integration|e2e|autoapply|marketplace"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
