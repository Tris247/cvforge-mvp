name: CI (SQLite-first)

on:
  push:
    branches: [ main, master, 'feat/*' ]
  pull_request:
    branches: [ main, master, 'feat/*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      OPENAI_API_KEY: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Prepare test files and SQLite DB
        run: |
          mkdir -p data
          touch dev.db
          echo "Using SQLite dev DB at ./dev.db for test run"
          # Apply the Prisma schema to the local sqlite dev.db (safe for CI)
          npx prisma db push --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/schema.prisma
        shell: bash

      - name: Run tests
        run: npm test --silent
        env:
          DATABASE_URL: file:./dev.db
          OPENAI_API_KEY: test

      - name: Upload test reports (optional)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-logs
          path: .
