version: '3.8'
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cvforge_dev
    ports:
      - '5432:5432'
    volumes:
      - data-postgres:/var/lib/postgresql/data

volumes:
  data-postgres:
